[project]
name = "parallax"
version = "0.1.0"
description = "Parallel Adversarial-prompt Recognition and Layered Aggregation for LLM eXploits"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "datasets>=5.0.1",
    "fastapi>=0.142.2",
    "filelock>=4.0.9",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.2",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.168.3",
    "mypy>=2.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: marks tests as integration tests (deselect with -m 'not integration')",
    "gpu: marks tests as requiring GPU (deselect with -m 'not gpu')",
    "slow: marks tests as slow (deselect with -m 'not slow')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["parallax/contracts"]


